<div class="stl-ctl">
  <div class="stl-project-banner" style="display:none;padding:4px 10px;font-size:0.82em;background:var(--bg-elev);border-bottom:1px solid var(--border);color:var(--text-muted)">
    <span data-i18n="plugin.stills.storage_prefix">Stockage :</span> <strong class="stl-project-name"></strong>
  </div>
  <div class="stl-noproject-banner" style="display:none;padding:4px 10px;font-size:0.82em;background:var(--bg-elev);border-bottom:1px solid var(--border);color:var(--text-muted)">
    <span data-i18n="plugin.stills.storage_all">Stockage : tous les projets (aucun projet assigné)</span>
  </div>
  <div class="stl-row">
    <label><span data-i18n="plugin.stills.folder">Dossier</span>
      <select class="stl-folder"><option value="" data-i18n="plugin.stills.loading_opt">— chargement… —</option></select>
    </label>
    <button class="stl-refresh" data-i18n-title="plugin.stills.refresh_tip" title="Rafraîchir la liste">↻</button>
  </div>

  <div class="stl-grid" data-i18n-aria="plugin.stills.thumbs_aria" aria-label="Vignettes"></div>

  <div class="stl-row stl-fit">
    <span class="stl-lbl" data-i18n="plugin.stills.fit_lbl">Cadrage :</span>
    <label><input type="radio" name="stl-fit" value="native" checked> <span data-i18n="plugin.stills.fit_native">Pixel à pixel</span></label>
    <label><input type="radio" name="stl-fit" value="fit"> <span data-i18n="plugin.stills.fit_fit">Au plus grand</span></label>
    <label><input type="radio" name="stl-fit" value="stretch"> <span data-i18n="plugin.stills.fit_stretch">Plein cadre</span></label>
  </div>

  <div class="stl-adv-row">
    <button type="button" class="stl-adv-toggle" aria-expanded="false" data-i18n="plugin.stills.pos_size">Position &amp; taille</button>
  </div>
  <div class="stl-adv" hidden>
    <label><span data-i18n="plugin.stills.x_pct">X (% du cadre)</span><input type="number" class="stl-x" value="0" step="1"></label>
    <label><span data-i18n="plugin.stills.y_pct">Y (% du cadre)</span><input type="number" class="stl-y" value="0" step="1"></label>
    <label><span data-i18n="plugin.stills.size_pct">Taille (%)</span><input type="number" class="stl-size" value="100" step="1" min="1"></label>
  </div>

  <div class="stl-row">
    <label class="stl-fade-lbl" data-i18n-title="plugin.stills.fade_tip" title="Durée du fondu au changement d'image (0 = coupe franche)"><span data-i18n="plugin.stills.fade">Fondu (ms)</span><input type="number" class="stl-fade" value="0" step="100" min="0" max="10000"></label>
    <button class="stl-apply" data-i18n="plugin.stills.apply">Appliquer</button>
    <button class="stl-monitor">Monitoring</button>
  </div>
  <div class="stl-status">…</div>
</div>
